[project]
name = "ekr-full-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dinesh Kumar", email = "dineshkumarc62004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
ekr-full-project = "ekr_full_project:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
